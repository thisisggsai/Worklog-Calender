<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sai's Worklog Calendar</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%232f6f4f'/%3E%3Cpath d='M28 52 L44 68 L74 32' stroke='white' stroke-width='10' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #ffffff;
    --bg-soft: #fbfbfa;
    --sidebar-bg: #f7f7f5;
    --border: #eceae6;
    --ink: #37352f;
    --ink-soft: #9b9a97;
    --accent: #2f6f4f;
    --accent-soft: #e6efe9;
    --overdue: #d9730d;
    --overdue-soft: #fbecdd;
    --shadow: 0 8px 28px rgba(15,15,15,0.10);
    --radius: 10px;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
  }

  body {
    margin: 0;
    font-family: 'Inter', sans-serif;
    background: var(--bg-soft);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }

  /* thin scrollbars */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-thumb { background: #d9d7d2; border-radius: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }

  .app-shell {
    display: grid;
    grid-template-columns: 230px minmax(0,1fr) 250px;
    grid-template-rows: auto 1fr auto;
    grid-template-areas:
      "header header header"
      "notes  calendar due"
      "footer footer footer";
    gap: 14px;
    height: 100vh;
    padding: 14px;
  }

  /* ---------- Header ---------- */
  .topbar {
    grid-area: header;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border);
  }

  .title {
    font-family: 'Source Serif 4', serif;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 0.2px;
    margin: 0;
  }

  .title .underline {
    text-decoration: underline;
    text-decoration-color: var(--accent);
    text-decoration-thickness: 3px;
    text-underline-offset: 4px;
  }

  .clock {
    text-align: right;
    line-height: 1.3;
  }

  .clock-date {
    font-size: 12px;
    color: var(--ink-soft);
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .clock-time {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 18px;
    font-weight: 600;
  }

  /* ---------- Side panels (notes + due) ---------- */
  .panel {
    background: var(--sidebar-bg);
    border-radius: var(--radius);
    border: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    min-height: 0;
    overflow: hidden;
  }

  .notes-panel { grid-area: notes; }
  .due-panel { grid-area: due; }

  .panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 14px;
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--ink-soft);
    border-bottom: 1px solid var(--border);
  }

  .panel-add-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--ink-soft);
    width: 22px;
    height: 22px;
    border-radius: 6px;
    font-size: 15px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s, color 0.15s;
  }
  .panel-add-btn:hover {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }

  .panel-body {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  /* ---------- Sticky notes ---------- */
  .note-card {
    border-radius: 8px;
    padding: 10px 12px;
    position: relative;
    box-shadow: 0 1px 3px rgba(15,15,15,0.05);
    transition: box-shadow 0.15s;
  }
  .note-card:hover {
    box-shadow: 0 4px 12px rgba(15,15,15,0.08);
  }

  .note-text {
    width: 100%;
    border: none;
    background: transparent;
    resize: none;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    line-height: 1.5;
    color: var(--ink);
    overflow: hidden;
    min-height: 22px;
  }
  .note-text:focus { outline: none; }
  .note-text::placeholder { color: rgba(55,53,47,0.35); }

  .note-delete {
    position: absolute;
    top: 6px;
    right: 6px;
    background: none;
    border: none;
    color: rgba(55,53,47,0.35);
    cursor: pointer;
    font-size: 13px;
    opacity: 0;
    transition: opacity 0.15s, color 0.15s;
    padding: 2px 4px;
  }
  .note-card:hover .note-delete { opacity: 1; }
  .note-delete:hover { color: var(--overdue); }

  .panel-empty {
    color: var(--ink-soft);
    font-size: 12px;
    font-style: italic;
    font-family: 'Source Serif 4', serif;
    text-align: center;
    padding: 18px 8px;
  }

  /* ---------- Due / overdue list ---------- */
  .due-item {
    display: flex;
    flex-direction: column;
    gap: 2px;
    padding: 8px 10px;
    border-radius: 6px;
    background: var(--overdue-soft);
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
  }
  .due-item:hover {
    transform: translateX(2px);
  }

  .due-item .due-date {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    color: var(--overdue);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    font-weight: 600;
  }

  .due-item .due-text {
    font-size: 12.5px;
    line-height: 1.4;
    word-break: break-word;
  }

  /* ---------- Calendar ---------- */
  .calendar-panel {
    grid-area: calendar;
    display: flex;
    flex-direction: column;
    min-height: 0;
    background: var(--bg);
    border-radius: var(--radius);
    border: 1px solid var(--border);
    overflow: hidden;
  }

  .calendar-toolbar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }

  .month-label {
    font-family: 'Source Serif 4', serif;
    font-size: 17px;
    font-weight: 600;
    min-width: 150px;
  }

  .nav-btn, .today-btn {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--ink);
    padding: 5px 11px;
    cursor: pointer;
    font-size: 12.5px;
    border-radius: 6px;
    transition: background 0.15s, color 0.15s;
  }
  .nav-btn:hover, .today-btn:hover {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }

  .month-count {
    margin-left: auto;
    font-size: 12px;
    color: var(--ink-soft);
    font-family: 'Source Serif 4', serif;
    font-style: italic;
  }

  .calendar-grid {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    grid-template-rows: auto repeat(6, 1fr);
    min-height: 0;
  }

  .weekday {
    text-align: center;
    font-size: 10.5px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--ink-soft);
    padding: 8px 4px;
    border-bottom: 1px solid var(--border);
    font-weight: 600;
  }

  .day-cell {
    border-right: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    padding: 6px 7px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    gap: 4px;
    min-height: 0;
    overflow: hidden;
    transition: background 0.12s;
  }
  .day-cell:hover { background: var(--bg-soft); }
  .day-cell:nth-child(7n) { border-right: none; }

  .day-cell.other-month {
    background: var(--bg-soft);
    opacity: 0.45;
    cursor: default;
  }
  .day-cell.other-month:hover { background: var(--bg-soft); }

  .day-number {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    font-weight: 600;
    width: 22px;
    height: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .day-cell.today .day-number {
    background: var(--accent);
    color: #fff;
    border-radius: 50%;
  }

  .cell-tasks {
    display: flex;
    flex-direction: column;
    gap: 3px;
    overflow: hidden;
    flex: 1;
    min-height: 0;
  }

  .cell-task {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    line-height: 1.3;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    color: var(--ink);
  }

  .cell-task .dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--accent);
    flex-shrink: 0;
  }

  .cell-task.done {
    color: var(--ink-soft);
    text-decoration: line-through;
  }
  .cell-task.done .dot { background: var(--ink-soft); }

  .cell-more {
    font-size: 10.5px;
    color: var(--ink-soft);
    font-family: 'IBM Plex Mono', monospace;
    margin-top: auto;
  }

  /* ---------- Quote bar ---------- */
  .quote-bar {
    grid-area: footer;
    text-align: center;
    padding: 10px 14px;
    border-top: 1px solid var(--border);
    font-family: 'Source Serif 4', serif;
    font-style: italic;
    font-size: 13px;
    color: var(--ink-soft);
  }

  #quoteText {
    transition: opacity 0.4s ease;
  }

  /* ---------- Modal ---------- */
  .day-modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(55,53,47,0.35);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    z-index: 50;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.2s ease, visibility 0.2s ease;
  }
  .day-modal-overlay.open {
    opacity: 1;
    visibility: visible;
  }

  .day-modal {
    background: var(--bg);
    border-radius: 12px;
    box-shadow: var(--shadow);
    width: 100%;
    max-width: 440px;
    max-height: 80vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transform: scale(0.95) translateY(10px);
    opacity: 0;
    transition: transform 0.25s cubic-bezier(.16,1,.3,1), opacity 0.2s ease;
  }
  .day-modal-overlay.open .day-modal {
    transform: scale(1) translateY(0);
    opacity: 1;
  }

  .modal-header {
    padding: 18px 20px 14px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }

  .modal-title {
    font-family: 'Source Serif 4', serif;
    font-size: 20px;
    font-weight: 600;
    margin: 0;
  }

  .modal-subtitle {
    font-size: 11px;
    color: var(--ink-soft);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-top: 4px;
  }

  .close-btn {
    background: none;
    border: none;
    font-size: 20px;
    cursor: pointer;
    color: var(--ink-soft);
    line-height: 1;
    padding: 2px 4px;
  }
  .close-btn:hover { color: var(--ink); }

  .task-list {
    list-style: none;
    margin: 0;
    padding: 8px 20px;
    overflow-y: auto;
    flex: 1;
  }

  .task-item {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
  }
  .task-item:last-child { border-bottom: none; }

  .task-item input[type="checkbox"] {
    margin-top: 2px;
    accent-color: var(--accent);
    width: 15px;
    height: 15px;
    flex-shrink: 0;
    cursor: pointer;
  }

  .task-text {
    flex: 1;
    word-break: break-word;
    line-height: 1.5;
    cursor: text;
    padding: 1px 3px;
    border-radius: 4px;
  }
  .task-text:hover { background: var(--accent-soft); }

  .task-text.done {
    text-decoration: line-through;
    color: var(--ink-soft);
  }

  .task-edit-input {
    flex: 1;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    line-height: 1.5;
    padding: 1px 3px;
    border: 1px solid var(--accent);
    border-radius: 4px;
    background: var(--bg);
    color: var(--ink);
  }
  .task-edit-input:focus { outline: none; }

  .delete-task {
    background: none;
    border: none;
    color: var(--ink-soft);
    cursor: pointer;
    font-size: 15px;
    padding: 0 2px;
    flex-shrink: 0;
  }
  .delete-task:hover { color: var(--overdue); }

  .empty-state {
    padding: 24px 0;
    text-align: center;
    color: var(--ink-soft);
    font-size: 13px;
    font-style: italic;
    font-family: 'Source Serif 4', serif;
  }

  .add-task-row {
    display: flex;
    gap: 8px;
    padding: 14px 20px;
    border-top: 1px solid var(--border);
  }

  .add-task-row input {
    flex: 1;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg-soft);
    color: var(--ink);
  }
  .add-task-row input:focus {
    outline: none;
    border-color: var(--accent);
  }

  .add-btn {
    font-family: 'Inter', sans-serif;
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 8px 16px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
  }
  .add-btn:hover { opacity: 0.88; }

  .status {
    font-size: 11px;
    color: var(--ink-soft);
    text-align: center;
    padding-bottom: 8px;
  }

  /* ---------- Responsive ---------- */
  @media (max-width: 1100px) {
    .app-shell {
      grid-template-columns: 1fr;
      grid-template-rows: auto auto auto auto auto;
      grid-template-areas:
        "header"
        "calendar"
        "notes"
        "due"
        "footer";
      height: auto;
      min-height: 100vh;
    }
    .calendar-grid { min-height: 480px; }
    .panel { max-height: 220px; }
  }

  @media (max-width: 600px) {
    .title { font-size: 17px; }
    .clock-time { font-size: 15px; }
    .cell-task { font-size: 10px; }
    .day-cell { padding: 4px 5px; }
  }
</style>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <h1 class="title">Sai's <span class="underline">Worklog</span> Calendar</h1>
      <div class="clock">
        <div class="clock-date" id="clockDate"></div>
        <div class="clock-time" id="clockTime"></div>
      </div>
    </header>

    <aside class="panel notes-panel">
      <div class="panel-header">
        <span>Notes</span>
        <button class="panel-add-btn" id="addNoteBtn" title="Add note">+</button>
      </div>
      <div class="panel-body" id="notesList"></div>
    </aside>

    <main class="calendar-panel">
      <div class="calendar-toolbar">
        <button class="nav-btn" id="prevBtn">&larr; Prev</button>
        <span class="month-label" id="monthLabel"></span>
        <button class="nav-btn" id="nextBtn">Next &rarr;</button>
        <button class="today-btn" id="todayBtn">Today</button>
        <span class="month-count" id="monthCount"></span>
      </div>
      <div class="calendar-grid" id="calendarGrid"></div>
    </main>

    <aside class="panel due-panel">
      <div class="panel-header">
        <span>Overdue</span>
      </div>
      <div class="panel-body" id="dueList"></div>
    </aside>

    <footer class="quote-bar">
      <span id="quoteText"></span>
    </footer>
  </div>

  <div class="day-modal-overlay" id="overlay">
    <div class="day-modal">
      <div class="modal-header">
        <div>
          <h2 class="modal-title" id="modalTitle"></h2>
          <div class="modal-subtitle" id="modalSubtitle"></div>
        </div>
        <button class="close-btn" id="closeBtn">&times;</button>
      </div>
      <ul class="task-list" id="taskList"></ul>
      <div class="add-task-row">
        <input type="text" id="taskInput" placeholder="What did you get done?" maxlength="200" />
        <button class="add-btn" id="addBtn">Add</button>
      </div>
      <div class="status" id="saveStatus"></div>
    </div>
  </div>

<script>
  /* ============ Storage keys ============ */
  const TASKS_KEY = 'worklog-data';
  const NOTES_KEY = 'worklog-notes';

  let data = {};   // { 'YYYY-MM-DD': [{id, text, done}] }
  let notes = [];  // [{id, text}]
  let currentDate = new Date();
  let selectedDateStr = null;

  /* ============ DOM refs ============ */
  const calendarGrid = document.getElementById('calendarGrid');
  const monthLabel = document.getElementById('monthLabel');
  const monthCount = document.getElementById('monthCount');
  const overlay = document.getElementById('overlay');
  const modalTitle = document.getElementById('modalTitle');
  const modalSubtitle = document.getElementById('modalSubtitle');
  const taskList = document.getElementById('taskList');
  const taskInput = document.getElementById('taskInput');
  const addBtn = document.getElementById('addBtn');
  const saveStatus = document.getElementById('saveStatus');
  const notesList = document.getElementById('notesList');
  const dueList = document.getElementById('dueList');

  const WEEKDAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const FULL_WEEKDAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const SHORT_MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const NOTE_COLORS = ['#FBF3DB','#E7F3F8','#FAE4E4','#E9F3E9','#EFE7F8','#FDEBE0'];
  const MAX_PREVIEW = 3;

  /* ============ Date helpers ============ */
  function pad(n){ return n.toString().padStart(2,'0'); }
  function dateKey(y,m,d){ return `${y}-${pad(m+1)}-${pad(d)}`; }
  function todayKey(){
    const t = new Date();
    return dateKey(t.getFullYear(), t.getMonth(), t.getDate());
  }
  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  /* ============ Persistence ============ */
  function loadData(){
    try {
      const raw = localStorage.getItem(TASKS_KEY);
      data = raw ? JSON.parse(raw) : {};
    } catch (e) { data = {}; }
  }
  function saveData(){
    try {
      localStorage.setItem(TASKS_KEY, JSON.stringify(data));
      saveStatus.textContent = 'Saved';
      setTimeout(()=>{ if(saveStatus.textContent === 'Saved') saveStatus.textContent = ''; }, 1200);
    } catch (e) {
      saveStatus.textContent = 'Could not save — storage may be full or disabled';
    }
  }

  function loadNotes(){
    try {
      const raw = localStorage.getItem(NOTES_KEY);
      notes = raw ? JSON.parse(raw) : [];
    } catch (e) { notes = []; }
  }
  function saveNotes(){
    try {
      localStorage.setItem(NOTES_KEY, JSON.stringify(notes));
    } catch (e) { /* ignore */ }
  }

  /* ============ Calendar rendering ============ */
  function render(){
    const y = currentDate.getFullYear();
    const m = currentDate.getMonth();
    monthLabel.textContent = `${MONTHS[m]} ${y}`;

    calendarGrid.innerHTML = '';
    WEEKDAYS.forEach(d => {
      const el = document.createElement('div');
      el.className = 'weekday';
      el.textContent = d;
      calendarGrid.appendChild(el);
    });

    const firstDay = new Date(y, m, 1).getDay();
    const daysInMonth = new Date(y, m+1, 0).getDate();
    const daysInPrevMonth = new Date(y, m, 0).getDate();
    const tKey = todayKey();

    let totalThisMonth = 0;

    for (let i = firstDay - 1; i >= 0; i--){
      const d = daysInPrevMonth - i;
      calendarGrid.appendChild(buildCell(y, m-1, d, true, tKey));
    }
    for (let d = 1; d <= daysInMonth; d++){
      const key = dateKey(y, m, d);
      if (data[key] && data[key].length) totalThisMonth += data[key].length;
      calendarGrid.appendChild(buildCell(y, m, d, false, tKey));
    }
    const totalCells = firstDay + daysInMonth;
    const trailing = (7 - (totalCells % 7)) % 7;
    for (let d = 1; d <= trailing; d++){
      calendarGrid.appendChild(buildCell(y, m+1, d, true, tKey));
    }

    monthCount.textContent = totalThisMonth === 0
      ? 'No entries logged yet'
      : `${totalThisMonth} ${totalThisMonth === 1 ? 'entry' : 'entries'} logged`;

    renderDueList(tKey);
  }

  function buildCell(y, m, d, otherMonth, tKey){
    const norm = new Date(y, m, d);
    const ny = norm.getFullYear(), nm = norm.getMonth(), nd = norm.getDate();
    const key = dateKey(ny, nm, nd);

    const cell = document.createElement('div');
    cell.className = 'day-cell' + (otherMonth ? ' other-month' : '') + (key === tKey ? ' today' : '');

    const num = document.createElement('div');
    num.className = 'day-number';
    num.textContent = nd;
    cell.appendChild(num);

    const tasks = data[key] || [];
    if (tasks.length){
      const list = document.createElement('div');
      list.className = 'cell-tasks';
      tasks.slice(0, MAX_PREVIEW).forEach(t => {
        const row = document.createElement('div');
        row.className = 'cell-task' + (t.done ? ' done' : '');
        const dot = document.createElement('span');
        dot.className = 'dot';
        const txt = document.createElement('span');
        txt.textContent = t.text;
        row.appendChild(dot);
        row.appendChild(txt);
        list.appendChild(row);
      });
      cell.appendChild(list);

      if (tasks.length > MAX_PREVIEW){
        const more = document.createElement('div');
        more.className = 'cell-more';
        more.textContent = `+${tasks.length - MAX_PREVIEW} more`;
        cell.appendChild(more);
      }
    }

    if (!otherMonth){
      cell.addEventListener('click', () => openModal(key, ny, nm, nd));
    }

    return cell;
  }

  /* ============ Overdue panel ============ */
  function renderDueList(tKey){
    const items = [];
    Object.keys(data).forEach(key => {
      if (key < tKey){
        (data[key] || []).forEach(t => {
          if (!t.done) items.push({ key, text: t.text });
        });
      }
    });
    items.sort((a,b) => a.key.localeCompare(b.key));

    dueList.innerHTML = '';
    if (!items.length){
      const empty = document.createElement('div');
      empty.className = 'panel-empty';
      empty.textContent = "Nothing overdue — you're all caught up.";
      dueList.appendChild(empty);
      return;
    }

    items.forEach(item => {
      const [y,m,d] = item.key.split('-').map(Number);
      const el = document.createElement('div');
      el.className = 'due-item';

      const dateEl = document.createElement('div');
      dateEl.className = 'due-date';
      dateEl.textContent = `${SHORT_MONTHS[m-1]} ${d}`;

      const textEl = document.createElement('div');
      textEl.className = 'due-text';
      textEl.textContent = item.text;

      el.appendChild(dateEl);
      el.appendChild(textEl);
      el.addEventListener('click', () => openModal(item.key, y, m-1, d));
      dueList.appendChild(el);
    });
  }

  /* ============ Modal ============ */
  function openModal(key, y, m, d){
    selectedDateStr = key;
    modalTitle.textContent = `${MONTHS[m]} ${d}`;
    modalSubtitle.textContent = `${FULL_WEEKDAYS[new Date(y,m,d).getDay()]} · ${y}`;
    saveStatus.textContent = '';
    taskInput.value = '';
    renderTaskList();
    overlay.classList.add('open');
    setTimeout(()=> taskInput.focus(), 100);
  }

  function closeModal(){
    overlay.classList.remove('open');
    selectedDateStr = null;
  }

  function renderTaskList(){
    const tasks = data[selectedDateStr] || [];
    taskList.innerHTML = '';
    if (!tasks.length){
      const empty = document.createElement('li');
      empty.className = 'empty-state';
      empty.textContent = 'Nothing logged for this day yet.';
      taskList.appendChild(empty);
      return;
    }
    tasks.forEach(task => {
      const li = document.createElement('li');
      li.className = 'task-item';

      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.checked = !!task.done;
      checkbox.addEventListener('change', () => {
        task.done = checkbox.checked;
        renderTaskList();
        saveAndRefresh();
      });

      const text = document.createElement('span');
      text.className = 'task-text' + (task.done ? ' done' : '');
      text.textContent = task.text;
      text.title = 'Double-click to edit';
      text.addEventListener('dblclick', () => startEditingTask(li, task));

      const del = document.createElement('button');
      del.className = 'delete-task';
      del.textContent = '✕';
      del.title = 'Remove';
      del.addEventListener('click', () => {
        data[selectedDateStr] = data[selectedDateStr].filter(t => t.id !== task.id);
        if (!data[selectedDateStr].length) delete data[selectedDateStr];
        renderTaskList();
        saveAndRefresh();
      });

      li.appendChild(checkbox);
      li.appendChild(text);
      li.appendChild(del);
      taskList.appendChild(li);
    });
  }

  function startEditingTask(li, task){
    const existingText = li.querySelector('.task-text');
    if (!existingText) return;

    const input = document.createElement('input');
    input.type = 'text';
    input.className = 'task-edit-input';
    input.value = task.text;
    input.maxLength = 200;

    li.replaceChild(input, existingText);
    input.focus();
    input.select();

    let finished = false;
    function commit(){
      if (finished) return;
      finished = true;
      const newText = input.value.trim();
      if (newText) task.text = newText;
      renderTaskList();
      saveAndRefresh();
    }
    function cancel(){
      if (finished) return;
      finished = true;
      renderTaskList();
    }

    input.addEventListener('blur', commit);
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); commit(); }
      else if (e.key === 'Escape') { e.preventDefault(); cancel(); }
    });
  }

  function addTask(){
    const text = taskInput.value.trim();
    if (!text || !selectedDateStr) return;
    if (!data[selectedDateStr]) data[selectedDateStr] = [];
    data[selectedDateStr].push({ id: Date.now() + '-' + Math.random().toString(36).slice(2,7), text, done: false });
    taskInput.value = '';
    renderTaskList();
    saveAndRefresh();
    taskInput.focus();
  }

  function saveAndRefresh(){
    render();
    saveData();
  }

  /* ============ Sticky notes ============ */
  function renderNotes(){
    notesList.innerHTML = '';
    if (!notes.length){
      const empty = document.createElement('div');
      empty.className = 'panel-empty';
      empty.textContent = 'Nothing here yet — jot down a reminder.';
      notesList.appendChild(empty);
      return;
    }
    notes.forEach((note, idx) => {
      const card = document.createElement('div');
      card.className = 'note-card';
      card.style.background = NOTE_COLORS[idx % NOTE_COLORS.length];

      const textarea = document.createElement('textarea');
      textarea.className = 'note-text';
      textarea.value = note.text;
      textarea.placeholder = 'Type a note…';
      textarea.rows = 1;

      const autoResize = () => {
        textarea.style.height = 'auto';
        textarea.style.height = (textarea.scrollHeight) + 'px';
      };

      textarea.addEventListener('input', () => {
        note.text = textarea.value;
        autoResize();
        saveNotes();
      });

      const del = document.createElement('button');
      del.className = 'note-delete';
      del.textContent = '✕';
      del.title = 'Remove note';
      del.addEventListener('click', () => {
        notes = notes.filter(n => n.id !== note.id);
        saveNotes();
        renderNotes();
      });

      card.appendChild(del);
      card.appendChild(textarea);
      notesList.appendChild(card);
      autoResize();
    });
  }

  function addNote(){
    const note = { id: Date.now() + '-' + Math.random().toString(36).slice(2,7), text: '' };
    notes.push(note);
    saveNotes();
    renderNotes();
    const textareas = notesList.querySelectorAll('.note-text');
    const last = textareas[textareas.length - 1];
    if (last) last.focus();
  }

    document.getElementById('clockTime').textContent =
      now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  }

  let lastQuoteHour = -1;
  function updateQuote(){
    const hour = Math.floor(Date.now() / 3600000);
    if (hour === lastQuoteHour) return;
    lastQuoteHour = hour;
    const idx = hour % QUOTES.length;
    const [text, character, series] = QUOTES[idx];
    const label = series ? `"${text}" — ${character}, ${series}` : `"${text}" — ${character}`;
    const el = document.getElementById('quoteText');
    el.style.opacity = 0;
    setTimeout(() => {
      el.textContent = label;
      el.style.opacity = 1;
    }, 300);
  }
