<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Worklog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #F6F3EC;
    --grid-line: #E1DCCD;
    --ink: #2C2A26;
    --ink-soft: #8A8478;
    --stamp-green: #44614A;
    --stamp-green-bg: #E2E9E1;
    --stamp-red: #A6402F;
    --card-bg: #FFFFFF;
    --shadow: 0 8px 30px rgba(44,42,38,0.14);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: 'IBM Plex Mono', monospace;
    background: var(--paper);
    color: var(--ink);
    background-image:
      linear-gradient(var(--grid-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
    background-size: 28px 28px;
    min-height: 100vh;
    padding: 24px 16px 60px;
  }

  .app {
    max-width: 880px;
    margin: 0 auto;
  }

  .header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 18px;
    padding-bottom: 14px;
    border-bottom: 2px solid var(--ink);
  }

  .title {
    font-family: 'Source Serif 4', serif;
    font-size: 28px;
    font-weight: 600;
    letter-spacing: 0.5px;
    margin: 0;
  }

  .title .underline {
    text-decoration: underline;
    text-decoration-color: var(--stamp-green);
    text-decoration-thickness: 3px;
    text-underline-offset: 4px;
  }

  .month-nav {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 14px;
  }

  .month-label {
    font-family: 'Source Serif 4', serif;
    font-size: 18px;
    font-weight: 600;
    min-width: 150px;
    text-align: center;
  }

  .nav-btn, .today-btn {
    font-family: 'IBM Plex Mono', monospace;
    background: var(--card-bg);
    border: 1px solid var(--ink);
    color: var(--ink);
    padding: 6px 10px;
    cursor: pointer;
    font-size: 13px;
    border-radius: 2px;
    transition: background 0.15s, color 0.15s;
  }
  .nav-btn:hover, .today-btn:hover {
    background: var(--ink);
    color: var(--paper);
  }

  .summary-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
    color: var(--ink-soft);
    margin-bottom: 10px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }

  .summary-row .count {
    font-family: 'Source Serif 4', serif;
    font-style: italic;
    text-transform: none;
    font-size: 13px;
    color: var(--stamp-green);
  }

  .calendar-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 1px;
    background: var(--grid-line);
    border: 1px solid var(--grid-line);
  }

  .weekday {
    background: var(--ink);
    color: var(--paper);
    font-size: 11px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    text-align: center;
    padding: 8px 4px;
    font-weight: 500;
  }

  .day-cell {
    background: var(--paper);
    min-height: 92px;
    padding: 8px;
    position: relative;
    cursor: pointer;
    transition: background 0.12s;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .day-cell:hover {
    background: #FBF9F4;
  }

  .day-cell.other-month {
    opacity: 0.32;
    cursor: default;
  }
  .day-cell.other-month:hover {
    background: var(--paper);
  }

  .day-number {
    font-size: 13px;
    font-weight: 600;
    color: var(--ink);
    width: 22px;
    height: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .day-cell.today .day-number {
    color: var(--paper);
    background: var(--stamp-red);
    border-radius: 50%;
  }

  .task-stamp {
    position: absolute;
    top: 6px;
    right: 6px;
    background: var(--stamp-green-bg);
    color: var(--stamp-green);
    border: 1.5px dashed var(--stamp-green);
    border-radius: 50%;
    width: 24px;
    height: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 600;
    transform: rotate(-8deg);
  }

  .task-preview {
    font-size: 11px;
    line-height: 1.4;
    color: var(--ink-soft);
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }

  .task-preview .bullet {
    color: var(--stamp-green);
    margin-right: 4px;
  }

  /* Modal */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(44,42,38,0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 50;
    padding: 16px;
  }

  .modal {
    background: var(--card-bg);
    border-radius: 4px;
    box-shadow: var(--shadow);
    width: 100%;
    max-width: 440px;
    max-height: 80vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .modal-header {
    padding: 18px 20px 14px;
    border-bottom: 1px solid var(--grid-line);
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }

  .modal-title {
    font-family: 'Source Serif 4', serif;
    font-size: 20px;
    font-weight: 600;
    margin: 0;
  }

  .modal-subtitle {
    font-size: 11px;
    color: var(--ink-soft);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-top: 4px;
  }

  .close-btn {
    background: none;
    border: none;
    font-size: 20px;
    cursor: pointer;
    color: var(--ink-soft);
    line-height: 1;
    padding: 2px 4px;
  }
  .close-btn:hover { color: var(--ink); }

  .task-list {
    list-style: none;
    margin: 0;
    padding: 8px 20px;
    overflow-y: auto;
    flex: 1;
  }

  .task-item {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 8px 0;
    border-bottom: 1px solid var(--grid-line);
    font-size: 13px;
  }
  .task-item:last-child { border-bottom: none; }

  .task-item input[type="checkbox"] {
    margin-top: 2px;
    accent-color: var(--stamp-green);
    width: 15px;
    height: 15px;
    flex-shrink: 0;
    cursor: pointer;
  }

  .task-text {
    flex: 1;
    word-break: break-word;
    line-height: 1.5;
  }

  .task-text.done {
    text-decoration: line-through;
    color: var(--ink-soft);
  }

  .delete-task {
    background: none;
    border: none;
    color: var(--ink-soft);
    cursor: pointer;
    font-size: 15px;
    padding: 0 2px;
    flex-shrink: 0;
  }
  .delete-task:hover { color: var(--stamp-red); }

  .empty-state {
    padding: 24px 0;
    text-align: center;
    color: var(--ink-soft);
    font-size: 13px;
    font-style: italic;
    font-family: 'Source Serif 4', serif;
  }

  .add-task-row {
    display: flex;
    gap: 8px;
    padding: 14px 20px;
    border-top: 1px solid var(--grid-line);
  }

  .add-task-row input {
    flex: 1;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    padding: 8px 10px;
    border: 1px solid var(--grid-line);
    border-radius: 2px;
    background: var(--paper);
    color: var(--ink);
  }
  .add-task-row input:focus {
    outline: none;
    border-color: var(--stamp-green);
  }

  .add-btn {
    font-family: 'IBM Plex Mono', monospace;
    background: var(--stamp-green);
    color: #fff;
    border: none;
    padding: 8px 16px;
    border-radius: 2px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
  }
  .add-btn:hover { opacity: 0.88; }
  .add-btn:disabled { opacity: 0.5; cursor: default; }

  .status {
    font-size: 11px;
    color: var(--ink-soft);
    text-align: center;
    padding-top: 8px;
  }

  @media (max-width: 600px) {
    .day-cell { min-height: 64px; padding: 6px; }
    .task-preview { display: none; }
    .title { font-size: 22px; }
    .month-label { font-size: 16px; min-width: 120px; }
  }
</style>
</head>
<body>
  <div class="app">
    <div class="header">
      <h1 class="title">Work<span class="underline">log</span></h1>
      <div class="month-nav">
        <button class="nav-btn" id="prevBtn">&larr; Prev</button>
        <span class="month-label" id="monthLabel"></span>
        <button class="nav-btn" id="nextBtn">Next &rarr;</button>
        <button class="today-btn" id="todayBtn">Today</button>
      </div>
    </div>

    <div class="summary-row">
      <span id="loadingStatus">Loading entries…</span>
      <span class="count" id="monthCount"></span>
    </div>

    <div class="calendar-grid" id="calendarGrid"></div>
  </div>

  <div class="overlay" id="overlay" style="display:none;">
    <div class="modal">
      <div class="modal-header">
        <div>
          <h2 class="modal-title" id="modalTitle"></h2>
          <div class="modal-subtitle" id="modalSubtitle"></div>
        </div>
        <button class="close-btn" id="closeBtn">&times;</button>
      </div>
      <ul class="task-list" id="taskList"></ul>
      <div class="add-task-row">
        <input type="text" id="taskInput" placeholder="What did you get done?" maxlength="200" />
        <button class="add-btn" id="addBtn">Add</button>
      </div>
      <div class="status" id="saveStatus"></div>
    </div>
  </div>

<script>
  const STORAGE_KEY = 'worklog-data';
  let data = {}; // { 'YYYY-MM-DD': [{id, text, done}] }
  let currentDate = new Date();
  let selectedDateStr = null;
  let storageReady = false;

  const calendarGrid = document.getElementById('calendarGrid');
  const monthLabel = document.getElementById('monthLabel');
  const monthCount = document.getElementById('monthCount');
  const loadingStatus = document.getElementById('loadingStatus');
  const overlay = document.getElementById('overlay');
  const modalTitle = document.getElementById('modalTitle');
  const modalSubtitle = document.getElementById('modalSubtitle');
  const taskList = document.getElementById('taskList');
  const taskInput = document.getElementById('taskInput');
  const addBtn = document.getElementById('addBtn');
  const saveStatus = document.getElementById('saveStatus');

  const WEEKDAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

  function pad(n){ return n.toString().padStart(2,'0'); }
  function dateKey(y,m,d){ return `${y}-${pad(m+1)}-${pad(d)}`; }
  function todayKey(){
    const t = new Date();
    return dateKey(t.getFullYear(), t.getMonth(), t.getDate());
  }

  async function loadData(){
    try {
      const result = await window.storage.get(STORAGE_KEY, false);
      data = result && result.value ? JSON.parse(result.value) : {};
    } catch (e) {
      data = {};
    }
    storageReady = true;
    loadingStatus.textContent = '';
    render();
  }

  async function saveData(){
    saveStatus.textContent = 'Saving…';
    try {
      const result = await window.storage.set(STORAGE_KEY, JSON.stringify(data), false);
      saveStatus.textContent = result ? 'Saved' : 'Could not save — try again';
      if (result) {
        setTimeout(()=>{ if(saveStatus.textContent === 'Saved') saveStatus.textContent = ''; }, 1200);
      }
    } catch (e) {
      saveStatus.textContent = 'Could not save — try again';
    }
  }

  function render(){
    const y = currentDate.getFullYear();
    const m = currentDate.getMonth();
    monthLabel.textContent = `${MONTHS[m]} ${y}`;

    calendarGrid.innerHTML = '';
    WEEKDAYS.forEach(d => {
      const el = document.createElement('div');
      el.className = 'weekday';
      el.textContent = d;
      calendarGrid.appendChild(el);
    });

    const firstDay = new Date(y, m, 1).getDay();
    const daysInMonth = new Date(y, m+1, 0).getDate();
    const daysInPrevMonth = new Date(y, m, 0).getDate();
    const tKey = todayKey();

    let totalThisMonth = 0;

    // leading days from previous month
    for (let i = firstDay - 1; i >= 0; i--){
      const d = daysInPrevMonth - i;
      const cell = buildCell(y, m-1, d, true, tKey);
      calendarGrid.appendChild(cell);
    }
    // days of this month
    for (let d = 1; d <= daysInMonth; d++){
      const key = dateKey(y, m, d);
      if (data[key] && data[key].length) totalThisMonth += data[key].length;
      const cell = buildCell(y, m, d, false, tKey);
      calendarGrid.appendChild(cell);
    }
    // trailing days to fill grid (to multiple of 7)
    const totalCells = firstDay + daysInMonth;
    const trailing = (7 - (totalCells % 7)) % 7;
    for (let d = 1; d <= trailing; d++){
      const cell = buildCell(y, m+1, d, true, tKey);
      calendarGrid.appendChild(cell);
    }

    monthCount.textContent = totalThisMonth === 0
      ? 'No entries logged yet'
      : `${totalThisMonth} ${totalThisMonth === 1 ? 'entry' : 'entries'} logged`;
  }

  function buildCell(y, m, d, otherMonth, tKey){
    // normalize month overflow/underflow
    const norm = new Date(y, m, d);
    const ny = norm.getFullYear(), nm = norm.getMonth(), nd = norm.getDate();
    const key = dateKey(ny, nm, nd);

    const cell = document.createElement('div');
    cell.className = 'day-cell' + (otherMonth ? ' other-month' : '') + (key === tKey ? ' today' : '');

    const num = document.createElement('div');
    num.className = 'day-number';
    num.textContent = nd;
    cell.appendChild(num);

    const tasks = data[key] || [];
    if (tasks.length){
      const stamp = document.createElement('div');
      stamp.className = 'task-stamp';
      stamp.textContent = tasks.length;
      cell.appendChild(stamp);

      const preview = document.createElement('div');
      preview.className = 'task-preview';
      preview.innerHTML = tasks.slice(0,2).map(t =>
        `<div><span class="bullet">—</span>${escapeHtml(t.text)}</div>`
      ).join('');
      cell.appendChild(preview);
    }

    if (!otherMonth){
      cell.addEventListener('click', () => openModal(key, ny, nm, nd));
    }

    return cell;
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function openModal(key, y, m, d){
    selectedDateStr = key;
    const dayName = WEEKDAYS[new Date(y,m,d).getDay()];
    const fullDayNames = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
    modalTitle.textContent = `${MONTHS[m]} ${d}`;
    modalSubtitle.textContent = `${fullDayNames[new Date(y,m,d).getDay()]} · ${y}`;
    overlay.style.display = 'flex';
    saveStatus.textContent = '';
    taskInput.value = '';
    renderTaskList();
    setTimeout(()=> taskInput.focus(), 50);
  }

  function closeModal(){
    overlay.style.display = 'none';
    selectedDateStr = null;
  }

  function renderTaskList(){
    const tasks = data[selectedDateStr] || [];
    taskList.innerHTML = '';
    if (!tasks.length){
      const empty = document.createElement('li');
      empty.className = 'empty-state';
      empty.textContent = 'Nothing logged for this day yet.';
      taskList.appendChild(empty);
      return;
    }
    tasks.forEach(task => {
      const li = document.createElement('li');
      li.className = 'task-item';

      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.checked = !!task.done;
      checkbox.addEventListener('change', () => {
        task.done = checkbox.checked;
        renderTaskList();
        saveAndRefresh();
      });

      const text = document.createElement('span');
      text.className = 'task-text' + (task.done ? ' done' : '');
      text.textContent = task.text;

      const del = document.createElement('button');
      del.className = 'delete-task';
      del.textContent = '✕';
      del.title = 'Remove';
      del.addEventListener('click', () => {
        data[selectedDateStr] = data[selectedDateStr].filter(t => t.id !== task.id);
        if (!data[selectedDateStr].length) delete data[selectedDateStr];
        renderTaskList();
        saveAndRefresh();
      });

      li.appendChild(checkbox);
      li.appendChild(text);
      li.appendChild(del);
      taskList.appendChild(li);
    });
  }

  function addTask(){
    const text = taskInput.value.trim();
    if (!text || !selectedDateStr) return;
    if (!data[selectedDateStr]) data[selectedDateStr] = [];
    data[selectedDateStr].push({ id: Date.now() + '-' + Math.random().toString(36).slice(2,7), text, done: false });
    taskInput.value = '';
    renderTaskList();
    saveAndRefresh();
    taskInput.focus();
  }

  async function saveAndRefresh(){
    render();
    if (storageReady) await saveData();
  }

  document.getElementById('prevBtn').addEventListener('click', () => {
    currentDate = new Date(currentDate.getFullYear(), currentDate.getMonth() - 1, 1);
    render();
  });
  document.getElementById('nextBtn').addEventListener('click', () => {
    currentDate = new Date(currentDate.getFullYear(), currentDate.getMonth() + 1, 1);
    render();
  });
  document.getElementById('todayBtn').addEventListener('click', () => {
    currentDate = new Date();
    render();
  });
  document.getElementById('closeBtn').addEventListener('click', closeModal);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) closeModal(); });
  addBtn.addEventListener('click', addTask);
  taskInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') addTask(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && overlay.style.display === 'flex') closeModal(); });

  render();
  loadData();
</script>
</body>
</html>
